name: Update front page

on:
  schedule:
    - cron: "0 11 * * *"→ Runs at 11:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidelinewire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: python build.py
      - name: Publish feed report
        if: always()
        run: cp feed_report.json public/feed_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-report
          path: sidelinewire/feed_report.json
