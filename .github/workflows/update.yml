name: Update front page

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidelinewire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: |
          if [ "${{ github.event_name }}" = "push" ] && curl -fsS --max-time 30 -o items.json https://ctidmississippi.github.io/sportsdrudge/items.json; then
            echo "Reusing last fetch (code-only push)"
            python build.py --reuse items.json || python build.py
          else
            python build.py
          fi
      - name: Publish feed report
        if: always()
        run: cp feed_report.json public/feed_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-report
          path: sidelinewire/feed_report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sidelinewire/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
