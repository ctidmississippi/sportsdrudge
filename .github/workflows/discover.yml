name: Discover feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for direct feeds
        run: python sidelinewire/discover.py
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sidelinewire/discovered.json
          git commit -m "Feed discovery results" || echo "nothing to commit"
          git pull --rebase origin main
          git push
